name: DNS Migration to Vercel

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Your domain (e.g. mysite.pe)'
        required: true
      vercel_project_id:
        description: 'Vercel Project ID or name'
        required: true

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Add domain to Vercel project ──────────────────────────────────────
      - name: Add Domain to Vercel Project
        id: add_domain
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DOMAIN="${{ github.event.inputs.domain }}"
          PROJECT="${{ github.event.inputs.vercel_project_id }}"

          RESPONSE=$(curl -s -X POST \
            "https://api.vercel.com/v9/projects/$PROJECT/domains" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\": \"$DOMAIN\"}")

          echo "Vercel response: $RESPONSE"

          ERROR=$(echo $RESPONSE | jq -r '.error.message // empty')
          if [ -n "$ERROR" ]; then
            echo "⚠️ Note: $ERROR"
          else
            echo "✅ Domain $DOMAIN added to Vercel project."
          fi

      # ── 2. Print nameserver instructions for punto.pe ────────────────────────
      - name: Print Nameserver Instructions
        run: |
          DOMAIN="${{ github.event.inputs.domain }}"

          echo "════════════════════════════════════════════════"
          echo "📋 ACTION REQUIRED — Update nameservers on punto.pe"
          echo "════════════════════════════════════════════════"
          echo ""
          echo "1. Go to https://punto.pe and log in"
          echo "2. Click 'Administrar' on domain: $DOMAIN"
          echo "3. Click 'Administrar DNS'"
          echo "4. Replace existing nameservers with:"
          echo ""
          echo "   ns1.vercel-dns.com"
          echo "   ns2.vercel-dns.com"
          echo ""
          echo "5. Confirm the change via the email punto.pe sends you"
          echo "════════════════════════════════════════════════"

      # ── 3. Poll DNS propagation (every 30s, up to 10 min) ────────────────────
      - name: Wait for DNS Propagation
        run: |
          DOMAIN="${{ github.event.inputs.domain }}"
          MAX_ATTEMPTS=20
          ATTEMPT=0

          echo "⏳ Polling DNS propagation for $DOMAIN..."
          echo "   (Full propagation can take up to 48h — this is an early check)"

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))

            NS=$(dig NS $DOMAIN +short 2>/dev/null | head -1)
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS — NS: ${NS:-not found yet}"

            if echo "$NS" | grep -qi "vercel"; then
              echo ""
              echo "✅ DNS propagated! $DOMAIN is now pointing to Vercel nameservers."
              exit 0
            fi

            sleep 30
          done

          echo ""
          echo "⏳ DNS not yet propagated — this is normal, can take up to 48h."
          echo "   Check progress at: https://www.whatsmydns.net/#NS/$DOMAIN"

      # ── 4. Verify domain is active on Vercel ─────────────────────────────────
      - name: Verify Domain on Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DOMAIN="${{ github.event.inputs.domain }}"
          PROJECT="${{ github.event.inputs.vercel_project_id }}"

          RESPONSE=$(curl -s \
            "https://api.vercel.com/v9/projects/$PROJECT/domains/$DOMAIN" \
            -H "Authorization: Bearer $VERCEL_TOKEN")

          VERIFIED=$(echo $RESPONSE | jq -r '.verified')

          if [ "$VERIFIED" = "true" ]; then
            echo "✅ Domain $DOMAIN is fully active and verified on Vercel!"
          else
            echo "⏳ Domain not yet verified on Vercel."
            echo "   Make sure you've updated the nameservers on punto.pe and confirmed the email."
          fi